[workspace]
members = ["."]
resolver = "2"

[package]
name = "studio-database"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "hooks", "limits", "modern_sqlite"] }
studio-core = { path = "../../m2/studio-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"

[patch.crates-io]
mdictlib = { path = "../../vendor/mdictlib-0.2.8-studio-sort-v6" }
