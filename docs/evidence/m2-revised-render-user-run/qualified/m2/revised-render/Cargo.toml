[workspace]
members = ["."]
resolver = "2"

[package]
name = "studio-revised-render"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
studio-xlsx-spool = { path = "../xlsx-spool" }
studio-xlsx = { path = "../xlsx-reader" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
