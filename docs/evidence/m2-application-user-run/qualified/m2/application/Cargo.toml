[workspace]
members = ["."]
resolver = "2"

[package]
name = "studio-application"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
studio-core = { path = "../studio-core" }
studio-xlsx = { path = "../xlsx-reader" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"

[patch.crates-io]
mdictlib = { path = "../../vendor/mdictlib-0.2.8-studio-sort-v6" }
