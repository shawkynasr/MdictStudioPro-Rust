[workspace]
members = ["."]
resolver = "2"

[package]
name = "studio-desktop-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
studio-indexed-engine = { path = "../../m2/indexed-engine" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"
mdictlib = { version = "=0.2.8", features = ["lzo"] }

[patch.crates-io]
mdictlib = { path = "../../vendor/mdictlib-0.2.8-studio-sort-v6" }
