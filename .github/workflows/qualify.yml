name: M0 and M1 qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r baseline/requirements.txt
      - run: python -m unittest discover -s baseline -v
      - run: python scripts/validate_evidence.py
      - run: python scripts/check_safari_sources.py
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo run --locked --package studio-engine-probe -- prove baseline/cases.json out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-proof-${{ matrix.os }}
          path: out/
  sort-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fetch --locked
      - run: python scripts/prepare_sort_experiment.py
      - run: cargo test --locked --manifest-path experiments/legacy-sort/Cargo.toml
      - run: cargo run --locked --manifest-path experiments/legacy-sort/Cargo.toml -- sort-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sort-proof-${{ matrix.os }}
          path: sort-out/
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mdict-utils==1.3.14
      - run: cargo fetch --locked
      - run: python scripts/prepare_sort_experiment.py
      - run: python scripts/prepare_sort_experiment.py --revision 3 --reuse
      - run: python scripts/patched_interop.py --writer-revision 3 --output interop-out-v3
      - name: Verify archived revision-3 metadata diagnostic (known limitations retained)
        run: python scripts/ci_legacy_metadata.py --output codec-out-v2
        if: always()
      - run: python scripts/reader_fixtures.py --output reader-out
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-interop
          path: |
            interop-out-v3/
            codec-out-v2/
            reader-out/
