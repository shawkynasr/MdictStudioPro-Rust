[workspace]
members = ["."]
resolver = "2"

[package]
name = "studio-xlsx-spool"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
quick-xml = "=0.38.3"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"

[dev-dependencies]
studio-xlsx = { path = "../xlsx-reader" }
